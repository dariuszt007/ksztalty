<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kształty po angielsku</title>

  <style>
    :root {
      --ink: #24314e;
      --pink: #ff6f91;
      --blue: #4ea5ff;
      --green: #40c99a;
      --yellow: #f3b82f;
      --purple: #9b7bff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #ffe0ed 0 8%, transparent 9%),
        radial-gradient(circle at 90% 20%, #d9f3ff 0 9%, transparent 10%),
        linear-gradient(145deg, #fffaf0, #eef8ff);
    }

    button, select, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .app {
      width: min(1100px, 100%);
      margin: auto;
      padding: 18px;
    }

    header {
      text-align: center;
      padding: 10px 0 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3rem);
    }

    header p { margin: 6px 0; }

    .panel {
      background: #ffffffdf;
      border: 2px solid #fff;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 10px 28px #35466a18;
      margin-bottom: 14px;
    }

    .setup {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      justify-content: center;
    }

    label {
      display: grid;
      gap: 5px;
      font-weight: 700;
    }

    select, input[type="range"] { accent-color: var(--purple); }

    select {
      padding: 9px 12px;
      border: 2px solid #dce4f3;
      border-radius: 12px;
      background: white;
    }

    .toggle-setting {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 8px 12px;
      border: 2px solid #dce4f3;
      border-radius: 12px;
      background: white;
      font-weight: 700;
    }

    .toggle-setting input {
      width: 20px;
      height: 20px;
      accent-color: var(--purple);
    }

    .primary, .secondary {
      border: 0;
      border-radius: 14px;
      padding: 11px 17px;
      font-weight: 800;
      color: white;
      background: var(--purple);
      box-shadow: 0 4px 0 #7659d8;
    }

    .secondary {
      background: #536989;
      box-shadow: 0 4px 0 #344660;
    }

    button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: none;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    #turnText {
      font-size: 1.15rem;
      font-weight: 900;
    }

    #topCard { font-weight: 800; }

    .scores {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .score {
      background: #f1f4fb;
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 750;
    }

    .score.active {
      outline: 3px solid var(--yellow);
      background: #fff7d7;
    }

    .play-area {
      min-height: 180px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 3px dashed #b7c5df;
      border-radius: 24px;
      background: linear-gradient(135deg, #f4f7ff, #fff7fb);
      transition: background-color .15s, border-color .15s;
    }

    .play-area.over {
      border-color: var(--purple);
      background: #f0ebff;
    }

    .play-area small {
      display: block;
      margin-top: 7px;
    }

    .card {
      width: 116px;
      height: 150px;
      flex: 0 0 auto;
      position: relative;
      display: grid;
      place-items: center;
      border: 4px solid white;
      border-radius: 20px;
      color: white;
      background: var(--card-color, var(--blue));
      box-shadow: 0 7px 0 #25355026, 0 9px 18px #2535501c;
      user-select: none;
      touch-action: none;
      cursor: grab;
      transition: transform .12s, box-shadow .12s, filter .15s, opacity .15s;
      will-change: transform;
    }

    .card:active { cursor: grabbing; }

    /* Ten efekt jest włączany tylko wtedy, gdy wybrano przygaszanie kart. */
    .card.unplayable.fogged {
      filter: grayscale(.55) brightness(.86);
      opacity: .58;
    }

    /* Żółte karty mają ciemne napisy, żeby były czytelne. */
    .card.yellow-card { color: #28334b; }

    .card .symbol {
      font-size: 3.5rem;
      line-height: 1;
      text-shadow: 0 2px 4px #0002;
    }

    .card.yellow-card .symbol { text-shadow: none; }

    .card .name {
      font-size: .88rem;
      font-weight: 900;
      text-align: center;
      padding: 0 5px;
    }

    .card .color-name {
      position: absolute;
      top: 7px;
      left: 8px;
      font-size: .66rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .card .hidden-points {
      position: absolute;
      bottom: 7px;
      right: 8px;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-size: .78rem;
      font-weight: 1000;
      background: #fff7c6;
      border: 2px solid white;
    }

    .card-back {
      width: 116px;
      height: 150px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: white;
      font-size: 2.3rem;
      font-weight: 900;
      border: 4px solid white;
      border-radius: 20px;
      background:
        repeating-linear-gradient(45deg, #ffffff18 0 8px, transparent 8px 16px),
        linear-gradient(135deg, #7968e8, #fa729e);
      box-shadow: 0 7px 0 #25355026, 0 9px 18px #2535501c;
      user-select: none;
    }

    .hand-wrap {
      overflow-x: auto;
      padding: 8px 2px 14px;
      overscroll-behavior-x: contain;
    }

    #hand {
      display: flex;
      gap: 12px;
      min-width: max-content;
      padding: 4px;
    }

    .hand-title {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .hand-title h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .hint {
      color: #52617a;
      font-size: .9rem;
      margin-top: 8px;
    }

    .log {
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f3f6fc;
      font-weight: 700;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: .88rem;
    }

    .legend span {
      background: #f3f6fc;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .drag-ghost {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 12px 25px #18233b44;
      transition: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      background: #1d294bb5;
      padding: 18px;
    }

    .overlay.show { display: grid; }

    .dialog {
      width: min(440px, 100%);
      text-align: center;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px #0003;
    }

    .color-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 18px 0;
    }

    .color-choice {
      width: 48px;
      height: 48px;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #d9deea;
    }

    @media (max-width: 600px) {
      .app { padding: 11px; }
      .panel {
        padding: 13px;
        border-radius: 18px;
      }
      .card, .card-back {
        width: 100px;
        height: 136px;
      }
      .card .symbol { font-size: 3rem; }
      .play-area { min-height: 155px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>

    <section class="panel setup" aria-label="Game settings">
      <label>
        <span id="playersLabel"></span>
        <select id="playerCount">
          <option value="1" id="players1"></option>
          <option value="2" id="players2"></option>
          <option value="3" id="players3"></option>
          <option value="4" id="players4"></option>
        </select>
      </label>

      <label>
        <span><span id="speedText"></span>: <span id="speedLabel">1.0×</span></span>
        <input id="speed" type="range" min="0.5" max="1.5" step="0.1" value="1">
      </label>

      <label class="toggle-setting">
        <input type="checkbox" id="fogToggle">
        <span id="fogLabel"></span>
      </label>

      <button class="primary" id="startBtn"></button>
      <button class="secondary" id="soundBtn"></button>
    </section>

    <section class="panel">
      <div class="status-row">
        <div>
          <div id="turnText"></div>
          <div id="topCard"></div>
        </div>
        <div class="scores" id="scores"></div>
      </div>
    </section>

    <section class="panel play-area" id="playArea" aria-label="Play area">
      <div>
        <div id="discard"></div>
        <strong id="dropText"></strong>
        <small id="matchingText"></small>
      </div>
    </section>

    <section class="panel">
      <div class="hand-title">
        <h2 id="handHeading"></h2>
        <div>
          <button class="primary" id="revealBtn" hidden></button>
          <button class="secondary" id="drawBtn"></button>
        </div>
      </div>

      <div class="hint" id="hint"></div>
      <div class="hand-wrap">
        <div id="hand"></div>
      </div>
      <div class="log" id="message" aria-live="polite"></div>
    </section>

    <section class="panel">
      <div class="legend" id="legend"></div>
    </section>
  </main>

  <div class="overlay" id="colorOverlay" role="dialog" aria-modal="true">
    <div class="dialog">
      <h2 id="chooseColorTitle"></h2>
      <p id="chooseColorText"></p>
      <div class="color-options" id="colorOptions"></div>
    </div>
  </div>

  <div class="overlay" id="endOverlay" role="dialog" aria-modal="true">
    <div class="dialog">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <button class="primary" id="againBtn"></button>
    </div>
  </div>

  <script>
    (() => {
      const translations = {
        pl: {
          title: "🎨 Kształty po angielsku",
          subtitle: "Posłuchaj, dopasuj kartę i odkrywaj ukryte punkty!",
          playersLabel: "Uczestnicy",
          players1: "1 osoba + komputer",
          players2: "2 osoby",
          players3: "3 osoby",
          players4: "4 osoby",
          speedText: "Tempo mowy",
          fogLabel: "Przygaszaj karty, których nie można użyć",
          start: "Nowa gra",
          testVoice: "🔊 Test głosu",
          initialTurn: "Wybierz liczbę uczestników i rozpocznij grę.",
          dropText: "Upuść tutaj kartę, żeby ją zagrać",
          matchingText: "Karta musi pasować kolorem lub kształtem. Dzika karta pasuje zawsze.",
          handHeading: "Twoje karty",
          reveal: "👁 Odkryj karty",
          draw: "Dobierz kartę",
          hint: "Kliknij kartę, aby usłyszeć angielską nazwę. Przytrzymaj i przeciągnij ją na pole gry, aby zagrać. Przy grze na jednym komputerze przekaż urządzenie kolejnej osobie, zanim odkryje swoje karty.",
          initialMessage: "Rozpocznij grę, aby zobaczyć karty.",
          legendSkip: "⏭ Skip — następny gracz traci turę",
          legendReverse: "🔄 Reverse — zmiana kierunku",
          legendDraw: "+2 — następny gracz dobiera 2 karty",
          legendWild: "🌈 Wild — wybierasz kolor",
          legendPoints: "⭐ Punkty są ukryte do chwili zagrania",
          chooseColor: "Wybierz kolor",
          chooseColorText: "Jakiego koloru ma być następna karta?",
          endTitle: "Koniec gry!",
          again: "Zagraj ponownie",
          gameOver: "Gra zakończona.",
          hiddenTurn: name => `Tura: ${name} — karty są zakryte`,
          turn: name => `Tura: ${name}`,
          hiddenHand: name => `Karty gracza: ${name} — zakryte`,
          playerHand: name => `Karty gracza: ${name}`,
          computerHand: "Karty komputera",
          score: (name, points, count) => `${name}: ${points} pkt · ${count} kart`,
          top: (card, color) => `Na wierzchu: ${card} · aktywny kolor: ${color}`,
          startMessage: "Gra rozpoczęta! Odkryj swoje karty i dopasuj kolor lub kształt.",
          unavailableSpeech: "Ta przeglądarka nie obsługuje syntezy mowy. Spróbuj innej przeglądarki.",
          invalidCard: "Ta karta nie pasuje. Wybierz ten sam kolor albo ten sam kształt.",
          revealedPoints: (points, card) => `Odkryto ${points} punktów! Zagrano: ${card}.`,
          drewCard: name => `${name} dobiera kartę.`,
          noCards: "Nie ma już kart do dobrania. Tura przechodzi dalej.",
          drawsTwo: name => `${name} dobiera 2 karty.`,
          computerDraws: "Komputer dobiera kartę.",
          computerPlayed: points => `Komputer zagrał kartę i odkrył ${points} punktów.`,
          computerChooses: color => ` Komputer wybiera kolor ${color}.`,
          rank: players => `Punkty: ${players}. Zwycięża `,
          winnerEnd: "Koniec gry!"
        },
        ja: {
          title: "🎨 英語の形をおぼえよう",
          subtitle: "カードを聞いて、形を合わせて、隠れたポイントを見つけよう！",
          playersLabel: "プレイヤー数",
          players1: "1人＋コンピューター",
          players2: "2人",
          players3: "3人",
          players4: "4人",
          speedText: "読み上げ速度",
          fogLabel: "出せないカードを薄く表示",
          start: "新しいゲーム",
          testVoice: "🔊 音声テスト",
          initialTurn: "人数を選んで、新しいゲームを始めてください。",
          dropText: "ここにカードを置いて出そう",
          matchingText: "カードは色か形が同じなら出せます。ワイルドカードはいつでも出せます。",
          handHeading: "あなたのカード",
          reveal: "👁 カードを表示",
          draw: "カードを引く",
          hint: "カードをタップすると英語の名前を聞けます。カードを押したままゲームエリアへ動かすと出せます。同じ端末で遊ぶときは、次の人に端末を渡してからカードを表示してください。",
          initialMessage: "ゲームを始めるとカードが表示されます。",
          legendSkip: "⏭ Skip — 次の人は1回休み",
          legendReverse: "🔄 Reverse — 順番が逆になる",
          legendDraw: "+2 — 次の人はカードを2枚引く",
          legendWild: "🌈 Wild — 色を選ぶ",
          legendPoints: "⭐ ポイントはカードを出すまで秘密",
          chooseColor: "色を選んでください",
          chooseColorText: "次のカードの色を選びましょう。",
          endTitle: "ゲーム終了！",
          again: "もう一度遊ぶ",
          gameOver: "ゲーム終了。",
          hiddenTurn: name => `${name}の番 — カードは伏せてあります`,
          turn: name => `${name}の番`,
          hiddenHand: name => `${name}のカード — 伏せてあります`,
          playerHand: name => `${name}のカード`,
          computerHand: "コンピューターのカード",
          score: (name, points, count) => `${name}: ${points}点 · ${count}枚`,
          top: (card, color) => `場のカード: ${card} · 有効な色: ${color}`,
          startMessage: "ゲーム開始！カードを表示して、色か形を合わせましょう。",
          unavailableSpeech: "このブラウザーは音声読み上げに対応していません。別のブラウザーをお試しください。",
          invalidCard: "このカードは出せません。同じ色か同じ形のカードを選んでください。",
          revealedPoints: (points, card) => `${points}ポイント獲得！出したカード: ${card}。`,
          drewCard: name => `${name}はカードを1枚引きました。`,
          noCards: "引けるカードがありません。次の人に順番が移ります。",
          drawsTwo: name => `${name}はカードを2枚引きます。`,
          computerDraws: "コンピューターはカードを引きました。",
          computerPlayed: points => `コンピューターがカードを出し、${points}ポイントを獲得しました。`,
          computerChooses: color => ` コンピューターは${color}を選びました。`,
          rank: players => `得点: ${players}。優勝は `,
          winnerEnd: "ゲーム終了！"
        }
      };

      const colors = [
        { name: "blue", pl: "niebieski", ja: "青", hex: "#4ea5ff" },
        { name: "red", pl: "czerwony", ja: "赤", hex: "#ff6f91" },
        { name: "green", pl: "zielony", ja: "緑", hex: "#40c99a" },
        { name: "yellow", pl: "żółty", ja: "黄", hex: "#f3b82f" }
      ];

      const actions = [
        { name: "skip", icon: "⏭", label: "Skip" },
        { name: "reverse", icon: "🔄", label: "Reverse" },
        { name: "draw two", icon: "+2", label: "Draw Two" }
      ];

      const shapes = [
        { name: "circle", icon: "●" },
        { name: "square", icon: "■" },
        { name: "triangle", icon: "▲" },
        { name: "rectangle", icon: "▰" },
        { name: "star", icon: "★" }
      ];

      const $ = id => document.getElementById(id);

      const browserLanguage = (navigator.languages && navigator.languages[0]) ||
        navigator.language ||
        "pl";

      const language = browserLanguage.toLowerCase().startsWith("ja") ? "ja" : "pl";
      const t = translations[language];

      document.documentElement.lang = language;

      let speed = 1;
      let players = [];
      let deck = [];
      let discard = [];
      let current = 0;
      let direction = 1;
      let activeColor = null;
      let gameOver = true;
      let waitingForWild = false;
      let handRevealed = false;
      let drag = null;
      let botTimer = null;
      let suppressNextClick = false;
      let fogEnabled = false;

      function setStaticText() {
        $("title").textContent = t.title;
        document.title = language === "ja" ? "英語の形をおぼえよう" : "Kształty po angielsku";
        $("subtitle").textContent = t.subtitle;
        $("playersLabel").textContent = t.playersLabel;
        $("players1").textContent = t.players1;
        $("players2").textContent = t.players2;
        $("players3").textContent = t.players3;
        $("players4").textContent = t.players4;
        $("speedText").textContent = t.speedText;
        $("fogLabel").textContent = t.fogLabel;
        $("startBtn").textContent = t.start;
        $("soundBtn").textContent = t.testVoice;
        $("dropText").textContent = t.dropText;
        $("matchingText").textContent = t.matchingText;
        $("handHeading").textContent = t.handHeading;
        $("revealBtn").textContent = t.reveal;
        $("drawBtn").textContent = t.draw;
        $("hint").textContent = t.hint;
        $("message").textContent = t.initialMessage;
        $("chooseColorTitle").textContent = t.chooseColor;
        $("chooseColorText").textContent = t.chooseColorText;
        $("endTitle").textContent = t.endTitle;
        $("againBtn").textContent = t.again;
        $("turnText").textContent = t.initialTurn;

        $("legend").innerHTML = "";
        [t.legendSkip, t.legendReverse, t.legendDraw, t.legendWild, t.legendPoints]
          .forEach(text => {
            const item = document.createElement("span");
            item.textContent = text;
            $("legend").appendChild(item);
          });
      }

      function localizedColor(index) {
        if (index === null || index === undefined) {
          return language === "ja" ? "任意" : "dowolny";
        }
        return colors[index][language];
      }

      function speak(text) {
        if (!("speechSynthesis" in window)) {
          $("message").textContent = t.unavailableSpeech;
          return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = speed;

        const voices = window.speechSynthesis.getVoices();
        const englishVoices = voices.filter(voice => /^en(-|_)/i.test(voice.lang));
        const preferredVoice = englishVoices.find(voice =>
          /male|david|mark|daniel|alex|guy/i.test(voice.name)
        );

        if (preferredVoice) {
          utterance.voice = preferredVoice;
        }

        window.speechSynthesis.speak(utterance);
      }

      $("speed").addEventListener("input", () => {
        speed = Number($("speed").value);
        $("speedLabel").textContent = speed.toFixed(1) + "×";
      });

      $("fogToggle").addEventListener("change", () => {
        fogEnabled = $("fogToggle").checked;
        try {
          localStorage.setItem("shapeGameFogEnabled", String(fogEnabled));
        } catch (_) {}
        render();
      });

      try {
        fogEnabled = localStorage.getItem("shapeGameFogEnabled") === "true";
        $("fogToggle").checked = fogEnabled;
      } catch (_) {}

      $("soundBtn").addEventListener("click", () => {
        speak("Circle, square, triangle, rectangle, star.");
      });

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function makeDeck() {
        const cards = [];
        let id = 0;

        for (let color = 0; color < colors.length; color++) {
          for (const shape of shapes) {
            for (let copy = 0; copy < 2; copy++) {
              cards.push({
                id: id++,
                type: "shape",
                color,
                shape: shape.name,
                icon: shape.icon,
                word: shape.name,
                points: 1 + Math.floor(Math.random() * 5)
              });
            }
          }

          for (const action of actions) {
            cards.push({
              id: id++,
              type: "action",
              color,
              shape: action.name,
              icon: action.icon,
              word: action.label,
              points: 1 + Math.floor(Math.random() * 5)
            });
          }
        }

        for (let i = 0; i < 4; i++) {
          cards.push({
            id: id++,
            type: "wild",
            color: null,
            shape: "wild",
            icon: "🌈",
            word: "wild",
            points: 1 + Math.floor(Math.random() * 5)
          });
        }

        return shuffle(cards);
      }

      function drawFromDeck() {
        if (!deck.length && discard.length > 1) {
          const top = discard.pop();
          deck = shuffle(discard);
          discard = [top];
        }
        return deck.pop() || null;
      }

      function topCard() {
        return discard[discard.length - 1];
      }

      function cardSpeech(card) {
        if (card.type === "shape") {
          return `${colors[card.color].name} ${card.word}`;
        }
        if (card.type === "wild") {
          return "wild card";
        }
        return `${colors[card.color].name} ${card.word}`;
      }

      function canPlay(card) {
        const top = topCard();
        if (!card || !top) return false;
        if (card.type === "wild") return true;
        if (card.color === activeColor) return true;

        if (
          top.type === "shape" &&
          card.type === "shape" &&
          card.shape === top.shape
        ) {
          return true;
        }

        return top.type === "action" &&
          card.type === "action" &&
          card.shape === top.shape;
      }

      function createCardElement(card, inHand, playable) {
        const element = document.createElement("div");
        const classes = ["card"];

        if (inHand && !playable) {
          classes.push("unplayable");
          if (fogEnabled) classes.push("fogged");
        }

        if (card.color === 3) {
          classes.push("yellow-card");
        }

        element.className = classes.join(" ");
        element.dataset.id = card.id;

        if (card.color === null) {
          element.style.setProperty("--card-color", "#9b7bff");
          element.style.background =
            "linear-gradient(135deg, #9b7bff, #ff6f91, #ffc943)";
        } else {
          element.style.setProperty("--card-color", colors[card.color].hex);
        }

        element.setAttribute("role", "button");
        element.setAttribute("aria-label", `${cardSpeech(card)}, hidden points`);
        element.innerHTML =
          `<span class="color-name">${card.color === null ? "wild" : colors[card.color].name}</span>` +
          `<span class="symbol">${card.icon}</span>` +
          `<span class="name">${card.word}</span>` +
          `<span class="hidden-points">?</span>`;

        element.addEventListener("click", () => {
          if (suppressNextClick) {
            suppressNextClick = false;
            return;
          }
          speak(cardSpeech(card));
        });

        element.addEventListener("pointerdown", event => {
          beginDrag(event, card, element);
        });

        return element;
      }

      function render() {
        $("scores").innerHTML = "";

        players.forEach((player, index) => {
          const chip = document.createElement("div");
          chip.className = "score" + (index === current && !gameOver ? " active" : "");
          chip.textContent = t.score(player.name, player.score, player.hand.length);
          $("scores").appendChild(chip);
        });

        const top = topCard();
        $("discard").innerHTML = "";

        $("topCard").textContent = top
          ? t.top(cardSpeech(top), localizedColor(activeColor))
          : "";

        if (top) {
          $("discard").appendChild(createCardElement(top, false, true));
        }

        const currentPlayer = players[current];
        const humanTurn = currentPlayer && !currentPlayer.bot;
        const handIsHidden = humanTurn && !handRevealed && !gameOver;

        if (gameOver) {
          $("turnText").textContent = t.gameOver;
        } else if (handIsHidden) {
          $("turnText").textContent = t.hiddenTurn(currentPlayer.name);
        } else {
          $("turnText").textContent = t.turn(currentPlayer?.name || "");
        }

        if (handIsHidden) {
          $("handHeading").textContent = t.hiddenHand(currentPlayer.name);
        } else if (humanTurn) {
          $("handHeading").textContent = t.playerHand(currentPlayer.name);
        } else {
          $("handHeading").textContent = t.computerHand;
        }

        $("hand").innerHTML = "";

        if (humanTurn && !gameOver) {
          if (handRevealed) {
            currentPlayer.hand.forEach(card => {
              $("hand").appendChild(createCardElement(card, true, canPlay(card)));
            });
          } else {
            currentPlayer.hand.forEach(() => {
              const back = document.createElement("div");
              back.className = "card-back";
              back.setAttribute("aria-label", "Hidden card");
              back.textContent = "★";
              $("hand").appendChild(back);
            });
          }
        }

        $("revealBtn").hidden = !handIsHidden;
        $("drawBtn").disabled =
          gameOver || !humanTurn || !handRevealed || waitingForWild;
      }

      function beginDrag(event, card, element) {
        if (
          gameOver ||
          waitingForWild ||
          !handRevealed ||
          players[current]?.bot ||
          !players[current]?.hand.some(item => item.id === card.id)
        ) {
          return;
        }

        event.preventDefault();

        const rect = element.getBoundingClientRect();
        const ghost = element.cloneNode(true);

        ghost.classList.add("drag-ghost");
        ghost.style.left = event.clientX + "px";
        ghost.style.top = event.clientY + "px";
        ghost.style.width = rect.width + "px";
        ghost.style.height = rect.height + "px";
        document.body.appendChild(ghost);

        drag = {
          ghost,
          startX: event.clientX,
          startY: event.clientY,
          x: event.clientX,
          y: event.clientY,
          moved: false,
          frame: 0
        };

        element.setPointerCapture(event.pointerId);

        const move = moveEvent => {
          if (!drag) return;

          drag.x = moveEvent.clientX;
          drag.y = moveEvent.clientY;

          if (Math.hypot(drag.x - drag.startX, drag.y - drag.startY) > 8) {
            drag.moved = true;
          }

          if (!drag.frame) {
            drag.frame = requestAnimationFrame(() => {
              if (!drag) return;

              drag.ghost.style.left = drag.x + "px";
              drag.ghost.style.top = drag.y + "px";
              drag.frame = 0;

              const area = $("playArea").getBoundingClientRect();
              const overArea =
                drag.x >= area.left &&
                drag.x <= area.right &&
                drag.y >= area.top &&
                drag.y <= area.bottom;

              $("playArea").classList.toggle("over", overArea);
            });
          }
        };

        const end = endEvent => {
          if (!drag) return;

          const state = drag;
          const x = endEvent.clientX;
          const y = endEvent.clientY;
          const area = $("playArea").getBoundingClientRect();
          const droppedOnArea =
            x >= area.left &&
            x <= area.right &&
            y >= area.top &&
            y <= area.bottom;

          if (state.frame) {
            cancelAnimationFrame(state.frame);
          }

          state.ghost.remove();
          drag = null;
          $("playArea").classList.remove("over");

          element.removeEventListener("pointermove", move);
          element.removeEventListener("pointerup", end);
          element.removeEventListener("pointercancel", end);

          if (droppedOnArea && state.moved) {
            suppressNextClick = true;
            setTimeout(() => { suppressNextClick = false; }, 300);
            playCard(card.id);
          }
        };

        element.addEventListener("pointermove", move);
        element.addEventListener("pointerup", end);
        element.addEventListener("pointercancel", end);
      }

      function nextIndex(steps = 1) {
        current = (current + direction * steps + players.length * 4) % players.length;
        handRevealed = false;
      }

      function drawMany(player, amount) {
        for (let i = 0; i < amount; i++) {
          const card = drawFromDeck();
          if (card) player.hand.push(card);
        }
      }

      function finishGame() {
        gameOver = true;
        render();

        const ranking = [...players].sort((a, b) => b.score - a.score);
        const rankingText = ranking
          .map(player => `${player.name} — ${player.score}`)
          .join(" · ");

        $("endTitle").textContent = t.winnerEnd;
        $("endText").textContent = t.rank(rankingText) + ranking[0].name + "!";
        $("endOverlay").classList.add("show");
      }

      function showColorPicker(callback) {
        const overlay = $("colorOverlay");
        const options = $("colorOptions");
        options.innerHTML = "";

        colors.forEach((color, index) => {
          const button = document.createElement("button");
          button.className = "color-choice";
          button.style.background = color.hex;
          button.setAttribute("aria-label", color[language]);

          button.addEventListener("click", () => {
            overlay.classList.remove("show");
            callback(index);
          });

          options.appendChild(button);
        });

        overlay.classList.add("show");
      }

      function playCard(id) {
        if (gameOver || waitingForWild || players[current].bot || !handRevealed) {
          return;
        }

        const player = players[current];
        const cardIndex = player.hand.findIndex(card => card.id === id);

        if (cardIndex < 0) return;

        const card = player.hand[cardIndex];

        if (!canPlay(card)) {
          $("message").textContent = t.invalidCard;
          return;
        }

        player.hand.splice(cardIndex, 1);
        discard.push(card);
        player.score += card.points;

        if (card.color !== null) {
          activeColor = card.color;
        }

        $("message").textContent =
          t.revealedPoints(card.points, cardSpeech(card));
        speak(cardSpeech(card));

        if (player.hand.length === 0) {
          finishGame();
          return;
        }

        let steps = 1;

        if (card.type === "action") {
          if (card.shape === "reverse") {
            direction *= -1;
          }

          if (card.shape === "skip") {
            steps = 2;
          }

          if (card.shape === "draw two") {
            const nextPlayerIndex =
              (current + direction + players.length) % players.length;
            drawMany(players[nextPlayerIndex], 2);
            $("message").textContent += " " + t.drawsTwo(players[nextPlayerIndex].name);
            steps = 2;
          }
        }

        if (card.type === "wild") {
          waitingForWild = true;

          showColorPicker(chosenColor => {
            activeColor = chosenColor;
            waitingForWild = false;
            nextIndex();
            render();
            scheduleBot();
          });

          render();
          return;
        }

        nextIndex(steps);
        render();
        scheduleBot();
      }

      function scheduleBot() {
        clearTimeout(botTimer);

        if (gameOver || !players[current]?.bot) return;

        render();

        botTimer = setTimeout(() => {
          const bot = players[current];
          const playableCards = bot.hand.filter(canPlay);

          if (!playableCards.length) {
            const drawnCard = drawFromDeck();
            if (drawnCard) bot.hand.push(drawnCard);

            $("message").textContent = t.computerDraws;
            nextIndex();
            render();
            scheduleBot();
            return;
          }

          const card = playableCards[Math.floor(Math.random() * playableCards.length)];
          const cardIndex = bot.hand.findIndex(item => item.id === card.id);

          bot.hand.splice(cardIndex, 1);
          discard.push(card);
          bot.score += card.points;

          if (card.color !== null) {
            activeColor = card.color;
          }

          $("message").textContent = t.computerPlayed(card.points);
          speak(cardSpeech(card));

          if (bot.hand.length === 0) {
            finishGame();
            return;
          }

          let steps = 1;

          if (card.type === "action") {
            if (card.shape === "reverse") {
              direction *= -1;
            }

            if (card.shape === "skip") {
              steps = 2;
            }

            if (card.shape === "draw two") {
              const nextPlayerIndex =
                (current + direction + players.length) % players.length;
              drawMany(players[nextPlayerIndex], 2);
              steps = 2;
            }
          }

          if (card.type === "wild") {
            activeColor = Math.floor(Math.random() * colors.length);
            $("message").textContent += t.computerChooses(localizedColor(activeColor));
          }

          nextIndex(steps);
          render();
          scheduleBot();
        }, 900);
      }

      function startGame() {
        clearTimeout(botTimer);

        players = [];
        const humanCount = Number($("playerCount").value);

        for (let i = 0; i < humanCount; i++) {
          players.push({
            name: humanCount === 1
              ? (language === "ja" ? "あなた" : "Ty")
              : (language === "ja" ? `プレイヤー ${i + 1}` : `Gracz ${i + 1}`),
            hand: [],
            score: 0,
            bot: false
          });
        }

        if (humanCount === 1) {
          players.push({
            name: language === "ja" ? "コンピューター" : "Komputer",
            hand: [],
            score: 0,
            bot: true
          });
        }

        deck = makeDeck();
        discard = [];
        current = 0;
        direction = 1;
        activeColor = null;
        gameOver = false;
        waitingForWild = false;
        handRevealed = false;

        for (let i = 0; i < 5; i++) {
          players.forEach(player => {
            const card = drawFromDeck();
            if (card) player.hand.push(card);
          });
        }

        let firstCard = deck.pop();

        while (firstCard && firstCard.type !== "shape") {
          deck.unshift(firstCard);
          firstCard = deck.pop();
        }

        if (!firstCard) {
          firstCard = drawFromDeck();
        }

        if (firstCard) {
          discard.push(firstCard);
          activeColor = firstCard.color;
        }

        $("message").textContent = t.startMessage;
        $("endOverlay").classList.remove("show");

        render();
        scheduleBot();
      }

      $("revealBtn").addEventListener("click", () => {
        handRevealed = true;
        render();
      });

      $("drawBtn").addEventListener("click", () => {
        if (gameOver || players[current]?.bot || !handRevealed) return;

        const card = drawFromDeck();

        if (card) {
          players[current].hand.push(card);
          $("message").textContent = t.drewCard(players[current].name);
        } else {
          $("message").textContent = t.noCards;
        }

        nextIndex();
        render();
        scheduleBot();
      });

      $("startBtn").addEventListener("click", startGame);

      $("againBtn").addEventListener("click", () => {
        $("endOverlay").classList.remove("show");
        startGame();
      });

      setStaticText();
      render();
    })();
  </script>
</body>
</html>
